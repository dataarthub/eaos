name: Documentation freshness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generated-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile --ignore-scripts --linker hoisted
      - run: bun run secrets:setup
      - run: bun run check
      - name: Verify generators and README landing freshness
        run: node --test scripts/check-generated.test.mjs scripts/generated-integration.test.mjs && node scripts/check-generated.mjs
      - name: Verify GitHub and package README requirements
        run: node --test scripts/check-readmes.test.mjs && node scripts/check-readmes.mjs
