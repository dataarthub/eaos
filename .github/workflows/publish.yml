name: "Publish npm packages"
run-name: "${{ github.event_name == 'workflow_dispatch' && (startsWith(inputs.staged_run, 'recover:') && format('Recover npm pre-stage candidate {0}', inputs.staged_run) || format('Complete npm staging run {0}', inputs.staged_run)) || format('Stage npm Release {0}', github.event.release.tag_name) }}"
on:
  release:
    types:
      - "published"
  workflow_dispatch:
    inputs:
      staged_run:
        description: "Original successful staging run ID after human npm approval"
        required: true
        type: "string"
permissions:
  contents: "read"
env:
  RELEASE_REPOSITORY_PRIVATE: "${{ github.event.repository.private }}"
concurrency:
  group: "eaos-npm-release"
  cancel-in-progress: false
jobs:
  verify:
    if: "github.event_name == 'release' && github.repository == 'dataarthub/eaos' && github.event.release.draft == false && github.event.release.prerelease == false && (github.event_name == 'release' && github.repository == 'dataarthub/eaos' && github.event.release.draft == false && github.event.release.prerelease == false && startsWith(github.event.release.tag_name, 'eaos-'))"
    runs-on: "ubuntu-latest"
    timeout-minutes: 45
    outputs:
      artifact: "${{ steps.upload.outputs.artifact-id }}"
    steps:
      -
        uses: "actions/checkout@v6"
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
          persist-credentials: false
        name: "Shared: actions/checkout@v6"
      -
        uses: "actions/setup-node@v6"
        with:
          node-version: 24
          package-manager-cache: false
        name: "Shared: actions/setup-node@v6"
      -
        name: "Project: Validate published package Release, source and selected version"
        id: "select"
        run: "node scripts/publish/context.mjs"
      -
        uses: "oven-sh/setup-bun@v2"
        with:
          bun-version: "1.4.3"
        name: "Shared: oven-sh/setup-bun@v2"
      -
        run: "npm install --global npm@11.21.0 --ignore-scripts --registry=https://registry.npmjs.org"
        name: "Project: Run declared project check"
      -
        run: "bun install --frozen-lockfile --ignore-scripts --linker hoisted --registry=https://registry.npmjs.org"
        name: "Project: Run declared project check"
      -
        name: "Project: Require exact-commit authoritative Source quality"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        run: "node scripts/workflow-supply/public/quality.mjs require-source"
      -
        run: "bun run secrets:setup"
        name: "Project: Run declared project check"
      -
        run: "bun run check"
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          GITHUB_TOKEN: "${{ github.token }}"
        name: "Project: Run declared project check"
      -
        run: "bun run secrets:check -- --history"
        name: "Project: Run declared project check"
      -
        run: "bunx playwright install --with-deps chromium"
        name: "Project: Run declared project check"
      -
        name: "Project: Verify AI draft editing, approval and save in four browser cases"
        run: "bun run test:ai-drafts:browser"
      -
        name: "Project: Prepare and test exact commit-bound release archives"
        run: |
          node scripts/release.mjs prepare --final > .verification/candidate-path.txt
          bun run test:consumer -- "$(cat .verification/candidate-path.txt)"
          bun run release:verify -- "$(cat .verification/candidate-path.txt)"
          node scripts/publish/bundle.mjs "$(cat .verification/candidate-path.txt)" .verification/handoff
      -
        uses: "actions/upload-artifact@v7"
        id: "upload"
        with:
          name: "verified-npm-release-${{ github.run_id }}-${{ github.run_attempt }}"
          path: |
            .verification/handoff/release.json
            .verification/handoff/*.tgz
            .verification/handoff/*.notes.md
          if-no-files-found: "error"
          include-hidden-files: true
          retention-days: 14
        name: "Shared: actions/upload-artifact@v7"
    permissions:
      contents: "read"
      actions: "read"
    env:
      NODE_OPTIONS: "--max-old-space-size=8192"
  stage:
    needs: "verify"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      contents: "read"
      id-token: "write"
      actions: "read"
    steps:
      -
        uses: "actions/checkout@v6"
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
          persist-credentials: false
        name: "Shared: actions/checkout@v6"
      -
        uses: "actions/setup-node@v6"
        with:
          node-version: 24
          package-manager-cache: false
        name: "Shared: actions/setup-node@v6"
      -
        run: "npm install --global npm@11.21.0 --ignore-scripts --registry=https://registry.npmjs.org"
        name: "Project: Run declared project check"
      -
        uses: "actions/download-artifact@v8"
        with:
          artifact-ids: "${{ needs.verify.outputs.artifact }}"
          path: ".verification/handoff"
          digest-mismatch: "error"
        name: "Shared: actions/download-artifact@v8"
      -
        name: "Project: Revalidate exact original Source quality evidence"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        run: "node scripts/workflow-supply/public/quality.mjs require-source"
      -
        name: "Project: Submit exact verified archives for human npm approval"
        run: "node scripts/publish/run.mjs stage"
  resolve:
    if: "github.event_name == 'workflow_dispatch' && github.repository == 'dataarthub/eaos' && github.ref == 'refs/heads/main'"
    runs-on: "ubuntu-latest"
    timeout-minutes: 45
    permissions:
      contents: "read"
      actions: "read"
    outputs:
      run: "${{ steps.original.outputs.run || steps.recovery.outputs.run }}"
      artifact: "${{ steps.original.outputs.artifact || steps.upload.outputs.artifact-id }}"
      commit: "${{ steps.original.outputs.commit || steps.recovery.outputs.commit }}"
    steps:
      -
        name: "Project: Require trusted default branch"
        run: "test \"$GITHUB_REF\" = refs/heads/main"
      -
        uses: "actions/checkout@v6"
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
          fetch-depth: 0
        name: "Shared: actions/checkout@v6"
      -
        uses: "actions/setup-node@v6"
        with:
          node-version: 24
          package-manager-cache: false
        name: "Shared: actions/setup-node@v6"
      -
        name: "Project: Resolve original successful staging attempt and immutable artifact"
        id: "original"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
          STAGED_RUN: "${{ inputs.staged_run }}"
        run: "mkdir -p .verification && node scripts/publish/evidence.mjs"
        if: "${{ !startsWith(inputs.staged_run, 'recover:') }}"
      -
        name: "Project: Validate catalogued never-staged original candidate"
        id: "recovery"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
          STAGED_RUN: "${{ inputs.staged_run }}"
        run: "node scripts/publish/recovery.mjs resolve"
        if: "startsWith(inputs.staged_run, 'recover:')"
      -
        uses: "actions/checkout@v6"
        with:
          ref: "${{ steps.recovery.outputs.commit }}"
          path: ".verification/source"
          fetch-depth: 0
          persist-credentials: false
        if: "startsWith(inputs.staged_run, 'recover:')"
        name: "Shared: actions/checkout@v6"
      -
        uses: "oven-sh/setup-bun@v2"
        with:
          bun-version: "1.4.3"
        if: "startsWith(inputs.staged_run, 'recover:')"
        name: "Shared: oven-sh/setup-bun@v2"
      -
        run: "npm install --global npm@11.21.0 --ignore-scripts --registry=https://registry.npmjs.org"
        if: "startsWith(inputs.staged_run, 'recover:')"
        name: "Project: Run declared project check"
      -
        name: "Project: Prepare original declared Kamal test consumer"
        run: |
          gem install --user-install kamal --version 2.12.0 --no-document
          ruby -e 'require "kamal"; require "kamal/cli"; abort "Unexpected Kamal version" unless Gem.loaded_specs.fetch("kamal").version.to_s == "2.12.0"'
        if: "startsWith(inputs.staged_run, 'recover:')"
      -
        name: "Project: Require original authoritative source evidence"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
          STAGED_RUN: "${{ inputs.staged_run }}"
          PUBLISH_SOURCE_SHA: "${{ steps.recovery.outputs.commit }}"
        run: "node scripts/workflow-supply/public/quality.mjs require-source"
        if: "startsWith(inputs.staged_run, 'recover:')"
      -
        name: "Project: Fresh full verification and exact archives from clean original source"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
          STAGED_RUN: "${{ inputs.staged_run }}"
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: "node scripts/publish/recovery.mjs verify"
        if: "startsWith(inputs.staged_run, 'recover:')"
      -
        uses: "actions/upload-artifact@v7"
        id: "upload"
        with:
          name: "verified-npm-release-${{ github.run_id }}-${{ github.run_attempt }}"
          path: |
            .verification/handoff/release.json
            .verification/handoff/*.tgz
            .verification/handoff/*.notes.md
          if-no-files-found: "error"
          include-hidden-files: true
          retention-days: 14
        if: "startsWith(inputs.staged_run, 'recover:')"
        name: "Shared: actions/upload-artifact@v7"
  complete:
    needs: "resolve"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      contents: "read"
      actions: "read"
      id-token: "write"
      deployments: "write"
    steps:
      -
        uses: "actions/checkout@v6"
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
          persist-credentials: false
        name: "Shared: actions/checkout@v6"
      -
        uses: "actions/setup-node@v6"
        with:
          node-version: 24
          package-manager-cache: false
        name: "Shared: actions/setup-node@v6"
      -
        run: "npm install --global npm@11.21.0 --ignore-scripts --registry=https://registry.npmjs.org"
        name: "Project: Run declared project check"
      -
        name: "Project: Revalidate original run identity before handoff"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
          STAGED_RUN: "${{ inputs.staged_run }}"
        run: |
          if [[ "$STAGED_RUN" == recover:* ]]; then
            node scripts/publish/recovery.mjs resolve
          else
            mkdir -p .verification
            node scripts/publish/evidence.mjs
          fi
      -
        uses: "actions/download-artifact@v8"
        with:
          artifact-ids: "${{ needs.resolve.outputs.artifact }}"
          run-id: "${{ needs.resolve.outputs.run }}"
          github-token: "${{ github.token }}"
          path: ".verification/handoff"
          digest-mismatch: "error"
        name: "Shared: actions/download-artifact@v8"
      -
        name: "Project: Revalidate exact original Source quality evidence"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
        run: "node scripts/workflow-supply/public/quality.mjs require-source"
      -
        name: "Project: Stage catalogued recovery or complete approved original bytes"
        env:
          GITHUB_TOKEN: "${{ github.token }}"
          STAGED_RUN: "${{ inputs.staged_run }}"
        run: |
          if [[ "$STAGED_RUN" == recover:* ]]; then
            node scripts/publish/run.mjs recover-stage
          else
            node scripts/publish/run.mjs complete
          fi
    env:
      PUBLISH_SOURCE_SHA: "${{ needs.resolve.outputs.commit }}"
      STAGED_RUN: "${{ inputs.staged_run }}"
