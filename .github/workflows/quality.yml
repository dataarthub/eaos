name: Public package quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile --ignore-scripts --linker hoisted
      - run: bun run secrets:setup
      - run: bun run check
      - name: Scan relevant repository history
        run: bun run secrets:check -- --history
      - run: bunx playwright install --with-deps chromium
      - name: Prepare and test exact archives
        run: |
          node scripts/release.mjs prepare > .verification/candidate-path.txt
          bun run test:consumer -- "$(cat .verification/candidate-path.txt)"
          bun run release:verify -- "$(cat .verification/candidate-path.txt)"
      - uses: actions/upload-artifact@v7
        with:
          name: verified-public-candidate
          path: .verification/release-*/
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: error
